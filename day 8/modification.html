<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <!-- konten -->
   <div id="myDiv">Hello, word</div>
   <!-- atribut -->
     <img id="myimage" src="../img/yaya.jpg" alt="gambar awal">
     
    <!-- ccs -->
     <div id="myDiv" style="width: 100px; height: 100px; background-color: aliceblue;">
      contoh element
     </div>

     <script>
        // mengubah konten id myDiv
        let myDiv = document.getElementById('myDiv');
        myDiv.textContent = 'Hello, javascript !';

        // mengubah atribut 'src' dari elemen gambar
        document.getElementById("myimage").setAttribute("src", "../../img/yaya.jpg");
        document.getElementById("myimage").setAttribute("alt", "gambar yaya");

        //mengubah properti css element
        let div = document.getElementById("myDiv");
        div.style.backgroundColor = "lightgreen";
        div.style.width = "200px";
        div.style.height = "200px";
     </script>
</body>
</html>
